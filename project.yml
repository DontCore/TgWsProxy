name: TgWsProxy
options:
  bundleIdPrefix: com.tgwsproxy
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  TgWsProxy:
    type: application
    platform: iOS
    sources:
      - path: TgWsProxy
        excludes: ["Info.plist", "TgWsProxy.entitlements"]
      - path: Shared
    dependencies:
      - target: PacketTunnel
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tgwsproxy.app
        PRODUCT_NAME: TgWsProxy
        INFOPLIST_FILE: TgWsProxy/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: TgWsProxy/TgWsProxy.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
        excludes: ["Info.plist", "PacketTunnel.entitlements"]
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tgwsproxy.app.packettunnel
        PRODUCT_NAME: PacketTunnel
        INFOPLIST_FILE: PacketTunnel/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        SKIP_INSTALL: YES
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"

schemes:
  TgWsProxy:
    build:
      targets:
        TgWsProxy: all
    run:
      config: Debug
    archive:
      config: Release
