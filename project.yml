name: TgWsProxy
options:
  bundleIdPrefix: com.tgwsproxy
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  TgWsProxy:
    type: application
    platform: iOS
    sources:
      - path: TgWsProxy
        excludes: ["Info.plist"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tgwsproxy.app
        PRODUCT_NAME: TgWsProxy
        INFOPLIST_FILE: TgWsProxy/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

schemes:
  TgWsProxy:
    build:
      targets:
        TgWsProxy: all
    run:
      config: Debug
    archive:
      config: Release
