name: Build TgWsProxy IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen and ldid
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned IPA (device)
        run: |
          set -o pipefail
          xcodebuild \
            -project TgWsProxy.xcodeproj \
            -scheme TgWsProxy \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tail -n 80

      - name: Package IPA (embed entitlements via ldid)
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/TgWsProxy.app" Payload/
          ls -la Payload/TgWsProxy.app Payload/TgWsProxy.app/PlugIns
          ldid -SPacketTunnel/PacketTunnel.entitlements "Payload/TgWsProxy.app/PlugIns/PacketTunnel.appex/PacketTunnel"
          ldid -STgWsProxy/TgWsProxy.entitlements "Payload/TgWsProxy.app/TgWsProxy"
          zip -r -q TgWsProxy-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TgWsProxy-unsigned-ipa
          path: TgWsProxy-unsigned.ipa
          retention-days: 30
